/**:
  ros__parameters:
    scan_for_devices: false
    port: '/dev/ttyUSB0'
    baudrate: 921600

    publisher_queue_size: 5
    time_option: 0
    enable_logging: false

    enable_deviceConfig: true
    enable_filter_config: false
    mti_filter_option: 0

    filter_label_rollpitch: "Robust"
    filter_label_yaw: "NorthReference"
    enable_active_heading_stabilization: false

    GNSS_LeverArm: [0.0, 0.0, 0.0]
    ublox_platform: 0
    enable_beidou: false

    # OBRIGATÓRIO: Mantidos os tópicos essenciais e o pub_nmea para alimentar o NTRIP
    pub_utctime: true
    pub_sampletime: true
    pub_imu: true
    pub_quaternion: true
    pub_euler: true
    pub_free_acceleration: true
    pub_angular_velocity: true
    pub_acceleration: true
    pub_dq: false
    pub_dv: false
    pub_mag: true
    pub_temperature: true
    pub_pressure: true
    pub_transform: true
    pub_status: true
    pub_twist: true
    pub_gnss: true
    pub_positionLLA: true
    pub_velocity: true
    pub_nmea: true               # OBRIGATÓRIO: publica as mensagens GGA para o NTRIP
    pub_gnsspose: true
    pub_odometry: false

    output_data_rate: 100
    output_data_rate_lower: 100
    output_data_rate_baro_mtione: 50

    enable_high_rate: false
    output_data_rate_acchr: 1000
    output_date_rate_gyrohr: 1000
    interpolate_orientation_high_rate: false

    enable_orientation_smoother: true
    enable_position_velocity_smoother: true
    enable_continuous_zero_rotation_update: true
    enable_inrun_compass_calibration: false

    enable_setting_baudrate: false
    set_baudrate_value: 2000000
    port_config_hardware_flow_control: true

    enable_manual_gyro_bias: false
    manual_gyro_bias_param: [15, 5]

    enable_rotsensor_frame_config: false
    rotsensor_rotation_euler: [180.0, 0.0, 0.0]

    linear_acceleration_stddev: [0.0, 0.0, 0.0]
    angular_velocity_stddev: [0.0, 0.0, 0.0]
    magnetic_field_stddev: [0.0, 0.0, 0.0]
    orientation_stddev: [0.0, 0.0, 0.0]